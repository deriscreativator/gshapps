<script>
const canApi=()=>!!(window.google&&google.script&&google.script.run)||!!(window.APP_CONFIG&&APP_CONFIG.API_URL);
function apiCall(a,p){const C=window.APP_CONFIG||{};
if(window.google&&google.script&&google.script.run)return new Promise((ok,no)=>google.script.run.withSuccessHandler(ok).withFailureHandler(no)[a](...p));
if(a=='apiSync')return fetch(C.API_URL+(C.API_URL.includes('?')?'&':'?')+'action=sync&since='+p[0]).then(r=>r.json());
const b=a=='apiSet'?{action:'set',c:p[0],id:p[1],d:JSON.parse(p[2])}:{action:'pdf',name:p[0],b64:p[1]};
return fetch(C.API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(b)}).then(r=>r.json())}
function isMob(){return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Mac/.test(navigator.platform))||window.top!==window}
async function savePdf(d,name){const blob=d.output('blob'),file=new File([blob],name,{type:'application/pdf'}),url=URL.createObjectURL(blob);setTimeout(()=>URL.revokeObjectURL(url),600000);
if(!isMob()){const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();return}
const sh=!!(navigator.canShare&&navigator.canShare({files:[file]})),n=esc(name),X=h=>{const e=$('#pdfX');if(e)e.innerHTML=h};
modal(`<h2>PDF siap</h2><p class=hint>${n}</p><div style="display:grid;gap:.9rem;margin-top:1rem">${sh?'<button class="btn" id="pdfS">Bagikan / Simpan</button>':''}<a class="btn ${sh?'g':''}" href="${url}" download="${n}">Unduh PDF</a><div id="pdfX" class="hint"></div></div>`);
if(sh)$('#pdfS').onclick=async()=>{try{await navigator.share({files:[file],title:name})}catch(e){}};
if(canApi()){X('Menyiapkan tautan Google Drive…');try{const r=await apiCall('apiPdf',[name,d.output('datauristring').split(',')[1]]);if(!r||!r.ok)throw 0;X(`<a class="btn g" style="width:100%" href="${r.url}" target="_blank" rel="noopener">Unduh lewat Google Drive</a>`)}catch(e){X('Tautan Drive tidak tersedia. Gunakan tombol di atas.')}}}
async function remoteStore(){const C=window.APP_CONFIG||{};if(!canApi())return false;const call=apiCall;
let ts=+localStorage.getItem('ipl_ts')||0,q=[],busy=0,off=0;try{q=JSON.parse(localStorage.getItem('ipl_q'))||[]}catch(e){}
try{S={...S,...JSON.parse(localStorage.getItem('ipl'))}}catch(e){}
const save=()=>{try{localStorage.setItem('ipl_q',JSON.stringify(q))}catch(e){}try{localStorage.setItem('ipl',JSON.stringify(S));localStorage.setItem('ipl_ts',ts)}catch(e){localStorage.removeItem('ipl_ts')}};
const nf=ok=>{if(ok)off=0;else if(!off){off=1;toast('Tidak tersambung ke server. Data disimpan di perangkat dan dikirim otomatis saat tersambung.')}};
const sync=async()=>{if(busy)return;busy=1;try{while(q.length){const[c,id,j]=q[0],r=await call('apiSet',[c,id,j]);if(!r||!r.ok)throw 0;q.shift();save()}
const r=await call('apiSync',[ts]);if(r&&r.ok){let ch=0;r.docs.forEach(x=>{if(q.some(y=>y[0]==x.c&&y[1]==x.id))return;(S[x.c]=S[x.c]||{})[x.id]=x.d;ch=1});ts=r.ts;save();if(ch)draw()}nf(1)}catch(e){nf(0)}busy=0};
ST.set=(c,id,d)=>{S[c][id]=d;q=q.filter(x=>!(x[0]==c&&x[1]==id));q.push([c,id,JSON.stringify(d)]);save();draw();sync()};
draw();sync();setInterval(()=>{if(!document.hidden)sync()},C.POLL_MS||15000);addEventListener('online',sync);document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});return true}
</script>

<script>

set(v){try{localStorage.setItem(TH.K,JSON.stringify({m:v}))}catch(e){}TH.apply()},
apply(){const m=TH.get(),dk=m=='dark'||(m=='system'&&matchMedia('(prefers-color-scheme:dark)').matches);document.documentElement.dataset.theme=dk?'dark':'light';
let t=document.querySelector('meta[name=theme-color]');if(!t){t=document.createElement('meta');t.name='theme-color';document.head.appendChild(t)}t.content=dk?'#0b1220':'#00529c';
document.querySelectorAll('[data-v]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v==m))}};

function svE(a){const r=RS().find(r=>r.a==a);ST.set('res','r_'+a,{...r,a,n:$('#en').value.trim(),st:$('#es').value,ar:$('#ea').value.split('\n').filter(x=>x.includes('|')).map(x=>{const[m,...k]=x.split('|');return[+m.replace(/\D/g,''),k.join('|').trim()]})});$('#md').style.display='none'}
function addW(){const n=$('#wn').value.trim(),a=$('#wa').value.trim().toUpperCase();if(!n||!/^[A-E]\d?-\d+$/.test(a)){alert('Isi nama dan alamat dengan benar, mis. E2-31.');return}ST.set('res','r_'+a,{a,n,st:'aktif',baru:true,j:'Warga Baru',ar:[],tg:new Date().toISOString().slice(0,10)})}
async function pdf(t,h,b,f){const d=new window.jspdf.jsPDF();try{d.addImage(LOGO,'PNG',14,8,30,20)}catch(e){}d.setFontSize(14);d.text(t,50,16);d.setFontSize(9);d.text('Perumahan Grand Sakha Huni · dicetak '+new Date().toLocaleDateString('id-ID'),50,22);d.autoTable({startY:32,head:[h],body:b,styles:{fontSize:8},headStyles:{fillColor:[79,114,153]}});

const INF=()=>S.info&&S.info.main||{t:'Informasi',x:''};
function infoCard(){const i=INF();return`<div class=card style="border-left:4px solid var(--gd)"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2 style="margin:0">${esc(i.t||'Informasi')}</h2>${U=='admin'?'<button class="btn g s" onclick=editInfo()>Edit</button>':''}</div><div style="white-space:pre-wrap;margin-top:10px">${esc(i.x)||'<small>Belum ada informasi dari pengurus.</small>'}</div>${i.tgl?`<small style="color:var(--mu);display:block;margin-top:10px">Diperbarui ${tg(i.tgl)}</small>`:''}</div>`}
function editInfo(){const i=INF();modal(`<h2>Edit Informasi</h2><label>Judul</label><input id=ij value="${esc(i.t)}"><label>Isi Informasi</label><textarea id=ix rows=7>${esc(i.x)}</textarea><button class=btn style="margin-top:12px" onclick=svI()>Simpan</button>`)}
function svI(){ST.set('info','main',{t:$('#ij').value.trim()||'Informasi',x:$('#ix').value.trim(),tgl:new Date().toISOString().slice(0,10)});$('#md').style.display='none'}
async function repAll(){const a=RS().filter(r=>r.n),now=new Date().toISOString().slice(0,10),d=new window.jspdf.jsPDF(),H={fillColor:[79,114,153]},st={fontSize:8};
const aw=a.reduce((t,r)=>t+arT(r),0),pd=a.reduce((t,r)=>t+paid(r.a),0),so=a.reduce((t,r)=>t+out(r),0);
const ttl=(x)=>{let y=d.lastAutoTable.finalY+10;if(y>265){d.addPage();y=20}d.setFontSize(11);d.text(x,14,y);return y+3};
try{d.addImage(LOGO,'PNG',14,8,30,20)}catch(e){}d.setFontSize(14);d.text('Laporan Pembayaran IPL Seluruh Warga',50,16);d.setFontSize(9);d.text('Perumahan Grand Sakha Huni · Periode: Januari 2026 s/d '+bln(now.slice(0,7)),50,22);
d.autoTable({startY:32,head:[['Ringkasan','Nilai']],body:[['Jumlah warga',a.length],['Total tunggakan awal',rp(aw)],['Total pembayaran diterima',rp(pd)],['Total sisa tunggakan',rp(so)]],styles:st,headStyles:H});
d.autoTable({startY:ttl('A. Rekap per Warga'),head:[['No','Nama','Alamat','Tunggakan Awal','Dibayar','Sisa','Status']],body:[...a.map((r,i)=>[i+1,r.n,r.a,rp(arT(r)),rp(paid(r.a)),rp(out(r)),r.st=='pindah'?'Pindah':out(r)?'Menunggak':'Lunas']),['','','Total',rp(aw),rp(pd),rp(so),'']],styles:st,headStyles:H});
const body=[];a.forEach(r=>{body.push([{content:r.n+' · '+r.a+' · '+(r.j||''),colSpan:4,styles:{fillColor:[221,230,241],fontStyle:'bold',textColor:[20,36,59]}}]);ledger(r).forEach(x=>body.push([bln(x.m),x.st,rp(x.by),rp(x.t)]))});
d.autoTable({startY:ttl('B. Rincian Pembayaran per Warga per Bulan (Januari s/d '+bln(now.slice(0,7))+')'),head:[['Bulan','Status','Dibayar','Tunggakan']],body,styles:st,headStyles:H,didParseCell:h=>{if(h.section=='body'&&h.column.index==1){const v=h.cell.raw;h.cell.styles.textColor=v=='Lunas'?[46,125,50]:v=='Kurang'?[176,110,20]:[192,57,43]}}});
const sb=subs().reverse();if(sb.length)d.autoTable({startY:ttl('C. Pengajuan Bukti Bayar via Aplikasi'),head:[['Tanggal','Nama','Alamat','Bulan','Status','Nominal']],body:sb.map(x=>[tg(x.tgl),x.n,x.a,bln(x.bulan),x.st=='ditolak'?'Ditolak: '+x.ket:x.st=='diterima'?'Diterima':'Menunggu',rp(x.nom)]),styles:st,headStyles:H});

function donut(v,c,mid,sub){const t=v.reduce((a,b)=>a+b,0)||1,C=2*Math.PI*40;let o=0;return`<svg viewBox="0 0 100 100" class=dn><circle cx=50 cy=50 r=40 fill=none stroke="var(--ln)" stroke-width=12 />${v.map((x,i)=>{const l=x/t*C,e=`<circle cx=50 cy=50 r=40 fill=none stroke="${c[i]}" stroke-width=12 stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-o}" transform="rotate(-90 50 50)"/>`;o+=l;return e}).join('')}<text x=50 y=51 text-anchor=middle font-size=16 font-weight=700 fill="var(--tx)">${mid}</text><text x=50 y=63 text-anchor=middle font-size=7 fill="var(--mu)">${sub}</text></svg>`}
function trend(m){const k=Object.keys(m).sort().slice(-6);if(!k.length)return'<small>Belum ada pembayaran diterima.</small>';const mx=Math.max(...k.map(x=>m[x]))||1,W=300,H=120,px=i=>k.length>1?24+i*(W-48)/(k.length-1):W/2,py=v=>H-18-v/mx*(H-44),pt=k.map((x,i)=>px(i)+','+py(m[x])).join(' ');return`<svg viewBox="0 0 ${W} ${H+14}" style="width:100%"><defs><linearGradient id=ag x1=0 y1=0 x2=0 y2=1><stop offset=0 stop-color="#4f7299" stop-opacity="0.5"/><stop offset=1 stop-color="#4f7299" stop-opacity="0"/></linearGradient></defs><polygon points="${px(0)},${H-18} ${pt} ${px(k.length-1)},${H-18}" fill="url(#ag)"/><polyline points="${pt}" fill=none stroke="#4f7299" stroke-width=2.5 stroke-linejoin=round />${k.map((x,i)=>`<circle cx=${px(i)} cy=${py(m[x])} r=4 fill="#fff" stroke="#4f7299" stroke-width=2 /><text x=${px(i)} y=${H+8} text-anchor=middle font-size=9 fill="var(--mu)">${bln(x).slice(0,3)}</text><text x=${px(i)} y=${py(m[x])-8} text-anchor=middle font-size=8 fill="var(--tx)">${Math.round(m[x]/1000)}rb</text>`).join('')}</svg>`}
function dash(rs){const a=rs.filter(r=>r.n&&r.st!='pindah'),lun=a.filter(r=>!out(r)).length,mg=a.length-lun,tk=a.reduce((t,r)=>t+paid(r.a),0),so=a.reduce((t,r)=>t+out(r),0),ss=subs(),c=s=>ss.filter(x=>x.st==s).length,jl={},mo={};a.forEach(r=>jl[r.j]=(jl[r.j]||0)+out(r));ss.filter(x=>x.st=='diterima').forEach(x=>mo[x.bulan]=(mo[x.bulan]||0)+x.nom);
const jm=Math.max(...Object.values(jl),1),top=[...a].filter(r=>out(r)).sort((x,y)=>out(y)-out(x)).slice(0,5),pc=Math.round(tk/((tk+so)||1)*100),sv=[c('diterima'),c('menunggu'),c('ditolak')],sT=sv.reduce((x,y)=>x+y,0)||1,cl=['#2e7d32','#4f7299','#c0392b'];
$('#dash').innerHTML=infoCard()+`<div class=kg><div class="kp hl"><small>Terkumpul</small><b>${rp(tk)}</b></div><div class=kp style="animation-delay:.05s"><small>Sisa Tunggakan</small><b class=red>${rp(so)}</b></div><div class=kp style="animation-delay:.1s"><small>Warga Aktif</small><b>${a.length}</b></div><div class=kp style="animation-delay:.15s"><small>Lunas</small><b class=ok>${lun}</b></div><div class=kp style="animation-delay:.2s"><small>Menunggak</small><b class=red>${mg}</b></div><div class=kp style="animation-delay:.25s"><small>Menunggu Verifikasi</small><b>${sv[1]}</b></div></div>
<div class=cg><div class=card><h2>Status Warga</h2>${donut([lun,mg],['#2e7d32','#c0392b'],a.length?Math.round(lun/a.length*100)+'%':'0%','LUNAS')}<div class=lgd><span><i style="background:#2e7d32"></i>Lunas ${lun}</span><span><i style="background:#c0392b"></i>Menunggak ${mg}</span></div></div>
<div class=card><h2>Tren Pembayaran Diterima</h2>${trend(mo)}</div></div>
<div class=card><h2>Tunggakan per Jalur</h2>${Object.entries(jl).map(([j,v])=>`<div style="display:flex;justify-content:space-between;font-size:13px"><span>${esc(j)}</span><b>${rp(v)}</b></div><div class=bar><i style="width:${v/jm*100}%"></i></div>`).join('')}</div>
<div class=cg><div class=card><h2>Progres Pelunasan</h2><div style="font-size:30px;font-weight:700;color:var(--gd)">${pc}%</div><div class=bar style="height:14px"><i style="width:${pc}%"></i></div><h3>Status Pengajuan Bukti</h3><div class=stk>${sv.map((x,i)=>`<i style="width:${x/sT*100}%;background:${cl[i]}"></i>`).join('')}</div><div class=lgd><span><i style="background:#2e7d32"></i>Diterima ${sv[0]}</span><span><i style="background:#4f7299"></i>Menunggu ${sv[1]}</span><span><i style="background:#c0392b"></i>Ditolak ${sv[2]}</span></div></div>
<div class=card><h2>5 Tunggakan Terbesar</h2>${top.map((r,i)=>`<div class=it onclick="hist('${r.a}')"><div><b>${i+1}. ${esc(r.n)}</b><small>${r.a}</small></div><span class=red>${rp(out(r))}</span></div>`).join('')||'<small>Tidak ada tunggakan.</small>'}</div></div>
<div class=card style="margin-top:16px;text-align:center"><button class=btn onclick=repAll()>Unduh Laporan Lengkap (PDF)</button></div>`}
function feed(){const l=subs().filter(s=>s.st!='menunggu').slice(0,30);$('#feed').innerHTML=`<div class=card><h2>Penyelesaian Pembayaran</h2>${l.map(s=>`<div class=it style="cursor:default"><div><b>${esc(s.n)}</b> · ${esc(s.a)}<small>${bln(s.bulan)} · ${s.tgl}${s.st=='ditolak'?`<br><span class=red>Alasan ditolak: ${esc(s.ket)}</span>`:s.ket?'<br>'+esc(s.ket):''}</small></div><div style="text-align:right"><b>${rp(s.nom)}</b><br><span class="bd ${s.st=='diterima'?'o':'m'}">${s.st=='diterima'?'Diterima':'Ditolak'}</span></div></div>`).join('')||'<small>Belum ada pembayaran yang selesai diproses.</small>'}</div>`}
initStore();lg();
</script>
